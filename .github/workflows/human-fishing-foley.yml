name: Bundle Human Fishing CC0 Foley Samples
on:
  push:
    branches: [main]
    paths:
      - "human-fishing/foley.js"
      - "human-fishing/scripts/install_foley_assets.py"
      - "human-fishing/scripts/render_reward_stingers.py"
      - ".github/workflows/human-fishing-foley.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: human-fishing-foley-bundle
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download reviewed CC0 field/foley recordings
        run: python human-fishing/scripts/install_foley_assets.py
      - name: Render four original treasure-acquisition melodies
        run: |
          ffmpeg -version | head -n 1
          python human-fishing/scripts/render_reward_stingers.py
      - name: Commit OGG clips for offline, low-latency local playback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/foley/
          if git diff --cached --quiet; then
            echo "All audio already bundled."
            exit 0
          fi
          git commit -m "Bundle natural Foley and original four treasure-acquisition OGG stingers"
          git pull --rebase origin main
          git push origin HEAD:main
