name: Refresh fish production candidate review queue after batch010
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-fish-work-queue-011-once.yml'
permissions:
  contents: write
concurrency:
  group: human-fishing-review-queue-011
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recompute preflight excluding all installed and reviewed art
        run: |
          python3 human-fishing/scripts/build_fish_art_work_queue.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('human-fishing')
          queue=json.loads((root/'fish-art-next-work-queue.json').read_text())
          print('CURRENT REVIEW SET:')
          for x in queue['nextReviewCandidates']:
           print(f"{x['reviewOrder']:02} {x['scientificName']} | stage={x['proposedStageName']} | family={x['family']} | suggested size={x['proposedSizeClass']}")
          assert len(queue['currentBatch'])==6
          existing=json.loads((root/'art-review/batch-009/review-manifest.json').read_text())
          old={x['scientificName'].lower() for x in existing['species']}
          assert not old.intersection(x.lower() for x in queue['currentBatch'])
          print('PASS: excludes all 18 earlier 9th/10th batch art species.')
          PY
          node human-fishing/qa-fish-production-plan.cjs
          git diff --check
      - name: Commit regenerated work queue and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add human-fishing/fish-art-next-work-queue.json
          git rm -- .github/workflows/refresh-fish-work-queue-011-once.yml
          git diff --cached --quiet || git commit -m 'Refresh next 24 fish candidates after verified batch010'
          git push origin HEAD:main
