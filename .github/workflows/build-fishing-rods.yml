name: Build Human Fishing Rod Bitmaps
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fishing-rods.yml'
      - 'human-fishing/scripts/build_rod_bitmaps.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: human-fishing-rod-art
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rasterize six transparent 5x fishing rods
        run: |
          set -euo pipefail
          python -m pip install -q Pillow
          python human-fishing/scripts/build_rod_bitmaps.py
      - name: Verify genuine PNG dimensions and alpha
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ('cork','bamboo','marine','carbon','titan','abyss'):
              p=Path('human-fishing/assets/rods')/(name+'.png')
              with Image.open(p) as im:
                  assert im.format=='PNG' and im.mode=='RGBA'
                  assert im.size==(1050,800)
                  a=im.getchannel('A')
                  assert a.getextrema()[0]==0 and a.getextrema()[1]==255
              print('PASS',p)
          PY
      - name: Commit game-ready bitmap art
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/rods/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish six named high-resolution fishing rod bitmap sprites"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
