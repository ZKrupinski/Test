name: Upload Approved Fever Vortex Bitmap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fever-vortex.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-fever-vortex-upload
  cancel-in-progress: false
jobs:
  sprite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstitute sixteen uploaded transparent vortex sprites
        run: |
          set -euo pipefail
          python -m pip install -q Pillow
          python human-fishing/scripts/build_fever_vortex.py
      - name: Upload prepared bitmap asset to game repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/octopus/bait/octofever_vortex_transparent.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upload transparent 16-frame OCTO FEVER suction vortex"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
