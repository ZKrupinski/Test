name: Bundle Human Fishing Surface and Underwater Ambience
on:
  push:
    branches: [main]
    paths:
      - "human-fishing/scripts/render_ambience_loops.py"
      - ".github/workflows/human-fishing-ambient.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: human-fishing-ambient-bundle
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install audio renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-venv >/dev/null
          python3 -m venv /tmp/hf-ambient-venv
          /tmp/hf-ambient-venv/bin/pip install -q numpy
      - name: Create original 12 regional loops and common diver ambience
        run: /tmp/hf-ambient-venv/bin/python human-fishing/scripts/render_ambience_loops.py
      - name: Verify all seamless OGG payloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          folder=Path('human-fishing/assets/ambience')
          files=sorted(folder.glob('*.ogg'))
          assert len(files)==13,(len(files),'expected 12 stages + underwater')
          fingerprints=set()
          for path in files:
              raw=path.read_bytes()
              assert raw[:4]==b'OggS' and len(raw)>4500,path
              fingerprints.add(hashlib.sha256(raw).digest())
          assert len(fingerprints)==13,'Ambience themes must be distinct'
          print('PASS: 12 unique stage soundscapes + common submerged pressure mix')
          PY
      - name: Commit playable loops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/ambience/
          if git diff --cached --quiet; then
            echo "All original ambience loops already installed."
            exit 0
          fi
          git commit -m "Bundle 13 original seamless surface and diver ambience loops"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Ambient asset push failed after retries"
          exit 1
