name: Human Fishing Alpha QA
on:
  push:
    paths:
      - "human-fishing/**"
      - ".github/workflows/human-fishing-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone game JS and 240-species catalog
        run: |
          node <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm'), assert=require('node:assert/strict');
          const html=fs.readFileSync('human-fishing/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/i);
          assert.ok(script,'Inline game script missing');
          new vm.Script(script[1],{filename:'human-fishing.js'});
          assert.match(html,/pointerdown/);
          assert.match(html,/pointerup/);
          assert.match(html,/localStorage/);
          assert.match(html,/function drawLine/);
          const raw = script[1].match(/var raw=\[([\s\S]*?)\];/);
          assert.ok(raw,'Species list missing');
          const lines = raw[1].split('\n').map(x=>x.trim()).filter(x=>x.startsWith("'"));
          assert.equal(lines.length,12,'Expected 12 habitats');
          for(const line of lines) {
            const v=line.replace(/^'/,'').replace(/',?$/,'').split('|');
            assert.equal(v.length,2);
            assert.equal(v[1].split(',').length,20,'Expected 20 species per habitat');
          }
          console.log('PASS: JavaScript parses, all 240 fish are present, gameplay handlers exist.');
          NODE
      - name: Validate approved human baby sprite PNG hashes and renderer
        run: node human-fishing/qa-human-sprites.cjs
      - name: Verify 17 new boy swimmers +12% world-only scale and unchanged original characters
        run: node human-fishing/qa-male-baby-scale.cjs
      - name: Validate standard gamepad mapping and controller vibration
        run: node human-fishing/qa-gamepad.cjs
      - name: Verify Fever multi-catch display and ambient audio preload
        run: node human-fishing/qa-fever-audio.cjs
      - name: Verify GameSir G8+ Android rumble API fallback and diagnostics
        run: node human-fishing/qa-gamesir-g8plus.cjs
      - name: Verify human codex and flawless fever guaranteed encounters
        run: node human-fishing/qa-human-codex-encounter.cjs
      - name: Verify all 35 temporary human previews, aquarium groups and untouched saves
        run: node human-fishing/qa-human-test-unlock.cjs
      - name: Verify 11 new human swimmers including sleepy
        run: node human-fishing/qa-human-swim11.cjs
      - name: Verify human residents survive aquarium-to-fishing transition
        run: node human-fishing/qa-aquarium-human-play.cjs
      - name: Verify aquarium menu roundtrips, offscreen resets, and animation lanes
        run: node human-fishing/qa-aquarium-menu-return.cjs
      - name: Verify shared human swim behavior in aquarium and normal stages
        run: node human-fishing/qa-human-swim-ai.cjs
      - name: Verify human mouth weakspot and fish human collision panic
        run: node human-fishing/qa-human-mouth-collision.cjs
      - name: Verify high-rarity catch rates, gear progression, weakspots and timing
        run: node human-fishing/qa-catch-balance.cjs
      - name: Verify resource gate and fixed landscape coordinates
        run: node human-fishing/qa-boot.cjs
      - name: Verify scene image loading, retries and frozen input
        run: node human-fishing/qa-scene-loading.cjs
      - name: Run game startup, input and shop smoke test
        run: node human-fishing/qa-smoke.cjs
      - name: Verify 304 approved originals retained and overlapping recolor filler removed
        run: node human-fishing/qa-fish-curation.cjs
      - name: Verify eight Work original PNG fish are byte-identical and safely registered
        run: node human-fishing/qa-fish-art-work-006.cjs
      - name: Verify six new original fish PNGs, taxonomy, region proxies, codex and unique behavior
        run: node human-fishing/qa-fish-art-batch-007.cjs
      - name: Verify batch008 skips all existing species and preserves seven unique PNG artworks
        run: node human-fishing/qa-fish-art-batch-008.cjs
      - name: Verify batch009 30 review artworks remain distinct and uninstalled pending source PNGs
        run: node human-fishing/qa-fish-art-batch-009.cjs
      - name: Verify batch upload web UI paths, token handling and workflow references
        run: node human-fishing/qa-fish-uploader.cjs
      - name: Verify five newly prepared original fish sprite registrations and source PNG gate
        run: node human-fishing/qa-fish-art-batch-004.cjs
      - name: Verify 10 batch023 sprites, save compatibility and 5 pending fourth-round candidates
        run: node human-fishing/qa-fish-art-batch-023.cjs
      - name: Verify strict no-infographic fish artwork queue batch 002
        run: node human-fishing/qa-fish-art-batch-002.cjs
      - name: Verify curated GPT fish batch 001 assignments, activation and unique movement
        run: node human-fishing/qa-fish-art-batch-001.cjs
      - name: Verify original art backlog, fast pack gates and 24 unique special plans
        run: node human-fishing/qa-fish-fast-inventory.cjs
      - name: Verify real and fictional special creature roster and S001 install gate
        run: node human-fishing/qa-special-creatures.cjs
      - name: Verify 1,600-fish expansion taxonomy queue and image QA gates
        run: node human-fishing/qa-fish-production-plan.cjs
      - name: Verify 291 active codex entries, artwork aliases, saved catches and rarity consistency
        run: node human-fishing/qa-fish-visual-catalog.cjs
      - name: Verify ten-second idle auto-fishing, natural movement and manual takeover
        run: node human-fishing/qa-auto-fishing.cjs
      - name: Verify instant underwater control, random cast depth and directional currents
        run: node human-fishing/qa-current-cast.cjs
      - name: Verify 12 habitat ambient loops, shared underwater mix and crossfades
        run: node human-fishing/qa-ambient.cjs
      - name: Verify 29 natural Foley clips and 39 distinct soft reward cues
        run: node human-fishing/qa-foley.cjs
      - name: Verify fish thumbnail, size, NEW badges and sequential Fever victory cards
        run: node human-fishing/qa-catch-showcase.cjs
      - name: Verify fish face left in all codex and acquisition tiles
        run: node human-fishing/qa-fish-ui-heading.cjs
      - name: Verify bitmap water FX and underwater-only bubbles
        run: node human-fishing/qa-water-fx.cjs
      - name: Verify GPU FX light pipeline, isolation and CPU fallback
        run: node human-fishing/qa-fx-shader.cjs
      - name: Verify congested fish disperse, choose lanes and pass safely
        run: node human-fishing/qa-ecology-traffic.cjs
      - name: Verify context-driven 16-frame companion animation states
        run: node human-fishing/qa-octo-sidekicks.cjs
      - name: Verify calm main octopus idle, fishing reactions and timing
        run: node human-fishing/qa-player-animation-director.cjs
      - name: Verify center-attached bait string and gently swinging octopus
        run: node human-fishing/qa-lure-line-hang.cjs
      - name: Verify normal and hooked bait is behind fish, Fever above
        run: node human-fishing/qa-lure-depth-order.cjs
      - name: Verify alpha-clean octopus lure PNGs and eight-frame atlas layout
        run: node human-fishing/qa-polished-lure-assets.cjs
      - name: Verify Fever VFX respects actual capture radius at all tiers and levels
        run: node human-fishing/qa-fever-effect-radius.cjs
      - name: Verify 128 isolated player sprite frames and aligned foot anchors
        run: node human-fishing/qa-octo-player-geometry.cjs
      - name: Inspect original player octopus frame bounds and foot baselines
        run: |
          python -m pip install -q Pillow
          python human-fishing/scripts/audit_octopus_sheets.py
          python human-fishing/scripts/qa_player_reactions.py
      - name: Verify latest six uploaded RGBA fish F379-F384 and save-safe catalog
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');
          const root='human-fishing/';
          const manifest=JSON.parse(fs.readFileSync(root+'assets/fish-expansion-012/installed-manifest.json','utf8'));
          const expected=['F379','F380','F381','F382','F383','F384'];
          assert.deepEqual(manifest.species.map(x=>x.gameId),expected);
          assert.equal(manifest.count,6);
          assert.equal(manifest.originalPixelsPreserved,true);
          assert.equal(fs.readFileSync(root+'assets/fish-expansion-012/ready.js','utf8').trim(),'window.HumanFishingFishExpansion012Ready=true;');
          const env={window:{HumanFishingFishExpansion012Ready:true}};
          vm.runInNewContext(fs.readFileSync(root+'fish-expansion-catalog-012.js','utf8'),env);
          const species=[];
          env.window.HumanFishingFishExpansion012.extend(species);
          env.window.HumanFishingFishExpansion012.extend(species);
          assert.equal(species.length,6);
          assert.equal(new Set(species.map(x=>x.scientificName)).size,6);
          assert.equal(new Set(species.map(x=>x.name)).size,6);
          for(const r of manifest.species){
            assert.equal(crypto.createHash('sha256').update(fs.readFileSync(root+r.installedPath)).digest('hex'),r.sha256);
            assert.equal(species.find(x=>x.id===r.gameId).habitat,r.habitat);
            assert.equal(species.find(x=>x.id===r.gameId).rarity,r.rarity);
          }
          const html=fs.readFileSync(root+'index.html','utf8');
          assert.ok(html.includes('HumanFishingFishExpansion012.extend(species)'));
          assert.ok(html.includes('fish-expansion-catalog-012.js'));
          assert.ok(fs.existsSync(root+'assets/fish/individual/F378.png'),'Existing F378 sprite not retained');
          console.log('PASS F379-F384 unique original sprites, hash, codex/habitat, save compatibility');
          NODE

  scene-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/human-fishing-browser playwright@1.58.2
          /tmp/human-fishing-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify shader Bloom/ADD in Chromium and low-power fallback
        env:
          NODE_PATH: /tmp/human-fishing-browser/node_modules
        run: node human-fishing/qa-fx-shader-browser.cjs
      - name: Test real scene loading and navigation in Chromium
        env:
          NODE_PATH: /tmp/human-fishing-browser/node_modules
        run: node human-fishing/qa-scene-browser.cjs
