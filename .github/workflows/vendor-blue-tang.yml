name: Vendor Blue Tang bitmap atlases
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-blue-tang.yml"
      - "human-fishing/scripts/vendor_bluetang.py"
      - "human-fishing/blue-tang-raster.js"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bitmap utility
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Produce local 2x4 transparent sprite atlases from approved image files
        run: python human-fishing/scripts/vendor_bluetang.py
      - name: Commit atlases when modified
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/bluetang
          if git diff --cached --quiet; then
            echo "Sprites already up to date"
            exit 0
          fi
          git commit -m "Store approved Blue Tang game sprite atlases locally"
          # Other asset/document edits may land while bitmap download runs.
          # Rebase on current main before pushing, never force-push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Trigger GitHub Pages deployment after asset commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
