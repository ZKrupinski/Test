name: Audit native fish artwork facing directions
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-fish-facing-orientation.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fish-facing-contact-sheet
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate source-art facing-direction proof sheets
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont,ImageOps
          import re,json,hashlib,math
          root=Path('human-fishing')
          files=sorted((root/'assets/fish/individual').glob('F[0-9][0-9][0-9].png'),key=lambda p:int(p.stem[1:]))
          special=sorted((root/'assets/special-creatures').glob('S[0-9][0-9][0-9].png'))
          output=root/'art-review/orientation-audit'
          output.mkdir(parents=True,exist_ok=True)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',22)
          notes=[]
          def render(group,prefix):
            for sheet_idx in range(math.ceil(len(group)/30)):
              subset=group[sheet_idx*30:(sheet_idx+1)*30]
              width,height=2040,1080
              board=Image.new('RGB',(width,height),'#e8eef1')
              draw=ImageDraw.Draw(board)
              for j,path in enumerate(subset):
                col,row=j%6,j//6
                x,y=col*340,row*216
                draw.rectangle((x+3,y+3,x+336,y+212),fill='#cedce4',outline='#90a8b6',width=1)
                try:
                  with Image.open(path) as im:
                    rgba=im.convert('RGBA')
                    content=ImageOps.contain(rgba,(325,166),Image.Resampling.LANCZOS)
                    base=Image.new('RGBA',(325,166),'#eef3f6')
                    base.alpha_composite(content,((325-content.width)//2,(166-content.height)//2))
                    board.paste(base.convert('RGB'),(x+7,y+7))
                    notes.append({'id':path.stem,'path':str(path),'size':list(im.size),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
                except Exception as e:
                  draw.text((x+18,y+60),'ERROR: '+str(e)[:30],fill='#aa0000',font=font)
                draw.text((x+13,y+179),path.stem,fill='#0e2034',font=font)
              filename=prefix+'-'+str(sheet_idx+1).zfill(2)+'.jpg'
              board.save(output/filename,format='JPEG',quality=86,optimize=True,subsampling=0)
              print(filename,'items',len(subset),'size',round((output/filename).stat().st_size/1024),'KiB')
          render(files,'fish')
          render(special,'special')
          (output/'audit-sources.json').write_text(json.dumps({'totalFish':len(files),'totalSpecial':len(special),'files':notes},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit reproducible thumbnails for visual inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add human-fishing/art-review/orientation-audit/
          git diff --cached --quiet || git commit -m 'Record orientation contact sheets for all registered fish artwork'
          git push origin HEAD:main
