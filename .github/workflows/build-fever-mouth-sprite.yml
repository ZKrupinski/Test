name: Build Approved Red Octo Fever Mouth Sprite
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fever-mouth-sprite.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-approved-fever-sprite
  cancel-in-progress: false
jobs:
  sprite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cut 16 user-approved illustrated frames into 512px transparent cells
        run: |
          set -euo pipefail
          python -m pip install -q Pillow
          python human-fishing/scripts/build_fever_mouth_sprite.py
      - name: Publish generated original-art bitmap sprite
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/octopus/bait/red_lure_fever_mouth.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install final expanded 16-frame Octo Fever mouth atlas"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
