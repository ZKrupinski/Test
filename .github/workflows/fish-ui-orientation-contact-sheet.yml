name: Build fish UI direction review sheets
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fish-ui-orientation-contact-sheet.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fish-ui-orientation-review
  cancel-in-progress: false
jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render individual artwork orientation for F305+ and special creatures
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont,ImageOps
          from pathlib import Path
          base=Path("human-fishing")
          fish=base/"assets/fish/individual"
          specials=base/"assets/special-creatures"
          output=base/"art-review/orientation"
          output.mkdir(parents=True,exist_ok=True)
          ids=sorted((p for p in fish.glob("F*.png") if int(p.stem[1:])>=305),key=lambda x:int(x.stem[1:]))
          sp=sorted(specials.glob("S*.png"))
          size=(285,174);cols=5;rows=5
          def make_sheet(files,filename):
            jpg=Image.new("RGB",(cols*size[0],rows*size[1]),"#bbccd3")
            draw=ImageDraw.Draw(jpg)
            font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",15)
            for i,source in enumerate(files):
              x=(i%cols)*size[0];y=(i//cols)*size[1]
              draw.rectangle((x+2,y+2,x+size[0]-3,y+size[1]-3),fill="#dae5e9")
              with Image.open(source) as im:
                im=im.convert("RGBA")
                bbox=im.getchannel("A").getbbox()
                if bbox: im=im.crop(bbox)
                im.thumbnail((size[0]-18,size[1]-36),Image.Resampling.LANCZOS)
                xx=x+(size[0]-im.width)//2;yy=y+22+(size[1]-28-im.height)//2
                jpg.paste(im,(xx,yy),im.getchannel("A"))
              draw.text((x+9,y+4),source.stem,font=font,fill="#082439")
            jpg.save(output/filename,quality=78,subsampling=1,optimize=True)
            print(filename,"fish",len(files),"bytes",(output/filename).stat().st_size)
          for i in range(0,len(ids),25):
            make_sheet(ids[i:i+25],f"fish-F305-plus-{i//25+1}.jpg")
          make_sheet(sp,"special-creatures.jpg")
          PY
      - name: Commit compact visual review sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/art-review/orientation/*.jpg
          git diff --cached --quiet || git commit -m "Generate fish original orientation visual QA sheets"
          git pull --rebase origin main
          git push origin HEAD:main
