name: Rebuild Synchronized Protagonist Idle Eyes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-player-idle-eyes.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild-player-idle-eyes
  cancel-in-progress: false
jobs:
  fix-idle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build corrected idle eyes from original 16-frame bitmap
        run: |
          set -euo pipefail
          python -m pip install -q Pillow numpy opencv-python-headless
          python human-fishing/scripts/fix_player_idle_eyes.py
      - name: Commit original-alpha eye-corrected bitmap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/octopus/atlases/purple_idle_eyes_synced.webp human-fishing/assets/octopus/atlases/_qa_idle_eye_compare.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align protagonist idle gaze without changing character design"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
