name: Apply stable red bait motion and cheering squad upgrade
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-red-lure-cheering-fix.yml'
permissions:
  contents: write
concurrency:
  group: human-fishing-red-lure-cheer-upgrade
  cancel-in-progress: false
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch approved bitmap motion and route helper powers to existing cheerleader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html_path=Path('human-fishing/index.html')
          side_path=Path('human-fishing/assets/octopus/octopus-sidekicks.js')
          depth_path=Path('human-fishing/qa-lure-depth-order.cjs')
          sprite_qa_path=Path('human-fishing/qa-polished-lure-assets.cjs')
          companion_qa_path=Path('human-fishing/qa-octo-sidekicks.cjs')
          smoke_qa_path=Path('human-fishing/qa-smoke.cjs')
          html=html_path.read_text()
          side=side_path.read_text()
          depth=depth_path.read_text()
          sprite_qa=sprite_qa_path.read_text()
          companion_qa=companion_qa_path.read_text()
          smoke_qa=smoke_qa_path.read_text()
          def replace_once(source, before, after, label):
              assert source.count(before)==1, f'{label}: expected one occurrence, found {source.count(before)}'
              return source.replace(before,after)
          # Keep the original approved RGBA art: only stabilize the source
          # cell eyelet coordinates (known erroneous atlas-anchor outliers).
          html=replace_once(html,
            " return (points[mode]||points.idle)[Math.max(0,Math.min(7,frame))];",
            """ var point=(points[mode]||points.idle)[Math.max(0,Math.min(7,frame))];
             // A few swim/back-swim frames have 20px outlying eyelet readings.
             // Use a consistent head pivot so their bodies no longer jump.
             // Keep the minuscule legitimate motion, never edit PNG pixels.
             if(mode==='swim'||mode==='back_swim'||mode==='up_swim'||mode==='down_swim')
              return [clamp(point[0],127,129),clamp(point[1],32,34)];
             if(mode==='idle')return [129,36];
             return point;""",
            '8-frame head pivot stabilization')
          html=replace_once(html,
            "var polishedLureSwimAxis='horizontal',polishedLureVerticalDirection=-1;",
            """var polishedLureSwimAxis='horizontal',polishedLureVerticalDirection=-1;
            // Frame-stable travel state. Prevent quick idle/swim and diagonal flips
            // near velocity thresholds, without changing the pendulum physics.
            var polishedLureStable={moving:false,mode:'idle',candidate:'idle',
             candidateAt:0,stopAt:null};
            function stablePolishedLureMode(now,vx,vy,dragging){
             var s=polishedLureStable,speed=Math.hypot(vx,vy);
             var enter=dragging?22:50,leave=dragging?13:16;
             if(speed>=enter){
              s.moving=true;s.stopAt=null;
             }else if(speed<leave){
              if(s.stopAt===null)s.stopAt=now;
              if(now-s.stopAt>=.16){s.moving=false;s.mode='idle'}
             }else s.stopAt=null;
             if(!s.moving)return 'idle';
             var candidate=polishedLureSwimMode(vx,vy);
             if(s.mode==='idle'){s.mode=candidate;s.candidate=candidate;s.candidateAt=now}
             else if(candidate!==s.mode){
              if(s.candidate!==candidate){s.candidate=candidate;s.candidateAt=now}
              else if(now-s.candidateAt>=.14){s.mode=candidate}
             }else{s.candidate=candidate;s.candidateAt=now}
             return s.mode;
            }""",
            'moving/idle hysteresis')
          moving_start=html.find(" }else if((typeof drag!=='undefined'&&drag)||")
          moving_terminator=" }else frame=Math.floor(now*6)%8;"
          assert moving_start>=0 and html.count(" }else if((typeof drag!=='undefined'&&drag)||")==1, 'motion condition changed'
          moving_end=html.find(moving_terminator,moving_start)
          assert moving_end>moving_start, 'motion condition terminator changed'
          moving_end+=len(moving_terminator)
          html=html[:moving_start]+""" }else if(pose.action==='fail'){
             frame=Math.floor(now*11)%8;
            }else if(typeof rodMotion!=='undefined'&&rodMotion){
             mode=stablePolishedLureMode(now,rodMotion.vx||0,rodMotion.vy||0,
              typeof drag!=='undefined'&&!!drag);
             frame=Math.floor(now*(mode==='idle'?6:10))%8;
            }else frame=Math.floor(now*6)%8;"""+html[moving_end:]
          # No extra hand-drawn vector octopuses: remove BOTH historical and
          # current drawHelpers definitions, then remove their three call sites.
          pattern_legacy=r"function drawHelpers\(now\)\{\n var lv=save\.shop\.helper;[\s\S]*?\n\}\nvar helperIncomeTimer=0;"
          assert len(re.findall(pattern_legacy,html))==1, 'legacy helper shape changed'
          html=re.sub(pattern_legacy,"var helperIncomeTimer=0;",html,count=1)
          pattern_active=r"function drawHelpers\(now\)\{\n var gear=selectedGear\('helper'\),power=gearPower\('helper'\);[\s\S]*?\n\}\n// Alpha 2\.2"
          assert len(re.findall(pattern_active,html))==1, 'active vector helper shape changed'
          html=re.sub(pattern_active,"// Alpha 2.2",html,count=1)
          assert html.count("drawRod(time);drawHelpers(time);")==2
          html=html.replace("drawRod(time);drawHelpers(time);","drawRod(time);")
          assert html.count("drawRod(now);drawHelpers(now);")==1
          html=html.replace("drawRod(now);drawHelpers(now);","drawRod(now);")
          assert 'drawHelpers(' not in html, 'vector companion still active'
          # Preserve helper category keys and all old owned/equipped/leveled IDs.
          html=html.replace('조력자','응원단')
          original=[
            "['crab','조개집게 게','초보 응원단',0,'#ffb98d']",
            "['shrimp','분홍 새우 친구','먹이 감지',120,'#ff9db3']",
            "['jelly','발광 해파리','빛 보조',300,'#a6eaff']",
            "['ray','꼬마 가오리','유영 탐지',700,'#7fc9dc']",
            "['octo','꼬마 문어 친구','릴 조작 보조',1350,'#e2a3f5']",
            "['drone','심해 탐사 드론','자동 지원',2700,'#ffe2a1']"
          ]
          corrected=[
            "['crab','새싹 응원단','기존 빨간 문어 · 기본 응원',0,'#ffb98d']",
            "['shrimp','리듬 응원단','빨간 문어의 릴 보조 강화',120,'#ff9db3']",
            "['jelly','반짝 응원단','빨간 문어의 진주 지원 강화',300,'#a6eaff']",
            "['ray','열혈 응원단','릴 조작 및 진주 지원 강화',700,'#7fc9dc']",
            "['octo','베테랑 응원단','릴 보조와 진주 지원 고급화',1350,'#e2a3f5']",
            "['drone','전설 응원단','빨간 문어의 최상위 응원',2700,'#ffe2a1']"
          ]
          for old,new in zip(original,corrected):
              html=replace_once(html,old,new,'supporter gear display')
          html=replace_once(html,
            "   save.coins+=coins;persist();updateStats();announce('🦑','응원단 지원','진주 +'+coins);playFoley('helperIncome',.72);",
            """   save.coins+=coins;persist();updateStats();
               // The existing, behind-player sprite celebrates the real support payout.
               if(window.octoSidekicksSupport)window.octoSidekicksSupport(time,gearPower('helper'));
               announce('🐙','응원단 지원','진주 +'+coins);playFoley('helperIncome',.72);""",
            'income now performed by visible red cheerleader')
          html=replace_once(html,
            "  if(cat==='octopus')updateFeverHud();",
            """  if(cat==='octopus')updateFeverHud();
              if(cat==='helper'&&window.octoSidekicksSupport)
               window.octoSidekicksSupport(time,gearPower('helper'));""",
            'upgrades signal behind-player cheerleader')
          # Sidekick owns exactly ONE genuine red sprite, no new helper sprites.
          side=replace_once(side,
            "  if(type==='fever')return [{name:'swim',seconds:.78},",
            """  if(type==='support')return [{name:'excited',seconds:.40},
               {name:'celebrate',seconds:.76}];
              if(type==='fever')return [{name:'swim',seconds:.78},""",
            'support cheer action')
          side=replace_once(side,
            "fever:6,catch:7,fail:8}[type]||1;",
            "fever:6,catch:7,fail:8,support:3}[type]||1;",
            'support action priority')
          side=replace_once(side,
            " window.octoSidekicksSignal=signal;",
            """ window.octoSidekicksSignal=signal;
             window.octoSidekicksSupport=function(now,power){
              if(power>0)signal('support',now,{power:power});
             };""",
            'existing companion takes over support cue')
          depth=replace_once(depth,
            "const rod=where('drawRod(time);drawHelpers(time);');",
            "const rod=where('drawRod(time);');",
            'render order rod stage')
          depth=replace_once(depth,
            "const hero=where('drawOcto(time);drawRod(time);drawHelpers(time);');",
            "const hero=where('drawOcto(time);drawRod(time);');",
            'render order main octopus')
          sprite_qa=replace_once(sprite_qa,
            "console.log('PASS vertical swimming, diagonals, reversal and axis hysteresis');",
            """console.log('PASS vertical swimming, diagonals, reversal and axis hysteresis');
            // Short frame-to-frame velocity changes must not make the sprite flicker.
            assert.equal(state.stablePolishedLureMode(0,100,0,false),'swim');
            assert.equal(state.stablePolishedLureMode(.03,-100,0,false),'swim');
            assert.equal(state.stablePolishedLureMode(.21,-100,0,false),'back_swim');
            assert.equal(state.stablePolishedLureMode(.22,0,0,false),'back_swim');
            assert.equal(state.stablePolishedLureMode(.40,0,0,false),'idle');
            assert.equal(state.stablePolishedLureMode(.41,100,0,false),'swim');
            assert.match(html,/clamp\\(point\\[0\\],127,129\\)/);
            assert.match(html,/clamp\\(point\\[1\\],32,34\\)/);
            console.log('PASS 8-frame eyelet stabilization and 140-160ms motion hysteresis');""",
            'sprite stability tests')
          companion_qa=replace_once(companion_qa,
            "assert.equal(typeof root.octoSidekicksSignal,'function');",
            """assert.equal(typeof root.octoSidekicksSignal,'function');
            assert.equal(typeof root.octoSidekicksSupport,'function');""",
            'sidekick support surface')
          companion_qa=replace_once(companion_qa,
            "root.octoSidekicksSignal('entrance',120);",
            """root.octoSidekicksSupport(115,4);
            assert.equal(step(115.2,states)[0].state,'support',
             'Upgraded support must play on the ORIGINAL red cheering sprite');
            root.octoSidekicksSignal('entrance',120);""",
            'companion functional upgrade tests')
          smoke_qa=replace_once(smoke_qa,
            "runtimeTick.indexOf('drawOcto(time);drawRod(time);drawHelpers(time)',sidekicks)",
            "runtimeTick.indexOf('drawOcto(time);drawRod(time);',sidekicks)",
            'smoke test visual stage without obsolete vector helpers')
          smoke_qa=replace_once(smoke_qa,"'조력자'","'응원단'",
            'shop navigation smoke test expects new cheering squad label')
          assert '조력자' not in html
          assert "helper:'응원단'" in html
          assert "window.drawOctopusSidekicks(ctx,time,octo)" in html
          assert side.count("{name:'빨간 문어'")==1
          for p,s in [(html_path,html),(side_path,side),(depth_path,depth),
                      (sprite_qa_path,sprite_qa),(companion_qa_path,companion_qa),
            (smoke_qa_path,smoke_qa)]:
              p.write_text(s)
          print('PASS: sprite anchors and hold-state fixed; vector helpers removed; existing red companion owns cheering benefits.')
          PY
      - name: Check existing input, sprite, rendering, and cheering tests
        run: |
          node human-fishing/qa-polished-lure-assets.cjs
          node human-fishing/qa-lure-line-hang.cjs
          node human-fishing/qa-lure-depth-order.cjs
          node human-fishing/qa-octo-sidekicks.cjs
          node human-fishing/qa-smoke.cjs
          node human-fishing/qa-catch-showcase.cjs
          node human-fishing/qa-special-creatures.cjs
          git diff --check
      - name: Commit only verified changes and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add human-fishing/index.html human-fishing/assets/octopus/octopus-sidekicks.js
          git add human-fishing/qa-lure-depth-order.cjs human-fishing/qa-polished-lure-assets.cjs human-fishing/qa-octo-sidekicks.cjs human-fishing/qa-smoke.cjs
          git rm -- .github/workflows/apply-red-lure-cheering-fix.yml
          git diff --cached --quiet || git commit -m 'Smooth red lure bitmap motion and connect helper upgrades to original cheering octopus'
          git push origin HEAD:main
