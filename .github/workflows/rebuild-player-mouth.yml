name: Restore Original-Style Player Mouth Sprite
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-player-mouth.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild-original-style-player-mouth
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate exact original-pixel 16f mouth sheet
        run: |
          python -m pip install -q Pillow
          python human-fishing/scripts/build_player_mouth_native.py
      - name: Commit bitmap resource, leaving success and failure images unchanged
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/octopus/player/mouth_open_original_style.webp
          if git diff --cached --quiet; then
            echo "Original-style mouth image already present"
          else
            git commit -m "Use original explorer art pixels for mouth-opening animation"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
