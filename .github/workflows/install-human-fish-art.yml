name: Import Human Fishing Fish Bitmaps (304)
on:
  push:
    paths:
      - human-fishing/fish-art-import.zip
      - 'human-fishing/fish-art-import.parts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: human-fishing-fish-import
  cancel-in-progress: false

jobs:
  install-fish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Reassemble uploader chunks with SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          dir=human-fishing/fish-art-import.parts
          if [ -d "$dir" ]; then
            shopt -s nullglob
            parts=("$dir"/part-*.bin)
            test "${#parts[@]}" -eq 15 || { echo 'Expected 15 upload parts'; exit 1; }
            cat "${parts[@]}" > human-fishing/fish-art-import.zip
            echo 'e93cdc5706ddf050ea95abea24ad8bc1a1a9de6f9923925b17382b2ee35f419b  human-fishing/fish-art-import.zip' | sha256sum -c -
          fi

      - name: Verify uploaded fish pack before installing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, json, struct
          p = 'human-fishing/fish-art-import.zip'
          with zipfile.ZipFile(p) as z:
              files = set(z.namelist())
              expected = {'individual/F%03d.png'%n for n in range(1,305)}
              if not expected.issubset(files):
                  raise SystemExit('Fish pack missing '+str(len(expected-files))+' individual PNGs')
              if 'manifest.json' not in files or 'ready.js' not in files:
                  raise SystemExit('Missing catalog manifest or activation flag')
              if any(n.startswith('/') or '..' in n.split('/') for n in files):
                  raise SystemExit('Unsafe zip path')
              m=json.loads(z.read('manifest.json'))
              fish=m.get('fish',[])
              ids=[f.get('id') for f in fish]
              if len(fish)!=304 or set(ids)!={'F%03d'%i for i in range(1,305)}:
                  raise SystemExit('Catalog must contain 304 unique fish IDs')
              for n in sorted(expected):
                  with z.open(n) as fp: head=fp.read(26)
                  if head[:8]!=b'\x89PNG\r\n\x1a\n' or head[25]!=6:
                      raise SystemExit('Not RGBA PNG: '+n)
                  w,h=struct.unpack('>II',head[16:24])
                  if not (10<=w<=1448 and 10<=h<=1402):
                      raise SystemExit('Invalid dimension: '+n)
          print('Verified 304 individual RGBA fish bitmaps and catalog')
          PY

      - name: Install images and catalog; enable only after successful verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p human-fishing/assets/fish
          python3 - <<'PY'
          import os,zipfile
          p='human-fishing/fish-art-import.zip'
          target='human-fishing/assets/fish'
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  if name=='ready.js':continue
                  dest=os.path.join(target,name)
                  os.makedirs(os.path.dirname(dest),exist_ok=True)
                  with z.open(name) as a,open(dest,'wb') as b:
                      while True:
                          chunk=a.read(1024*1024)
                          if not chunk:break
                          b.write(chunk)
              with z.open('ready.js') as a,open(os.path.join(target,'ready.js'),'wb') as b:
                  b.write(a.read())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A human-fishing/assets/fish
          git rm -f --ignore-unmatch -- human-fishing/fish-art-import.zip
          git rm -rf --ignore-unmatch -- human-fishing/fish-art-import.parts
          if ! git diff --cached --quiet; then
            git commit -m "Install 304 clean-alpha fish bitmaps into human fishing"
            git push origin HEAD:main
          fi
