name: Assemble Connected Swallow Frames
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-connected-swallow.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: connected-swallow-build
  cancel-in-progress: false
jobs:
  sprite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build sixteen original-style swallow frames
        run: |
          set -euo pipefail
          python -m pip install -q Pillow
          python human-fishing/scripts/build_swallow_success_connected.py
      - name: Commit transparent connected success sprite sheet
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-fishing/assets/octopus/player/swallow_success_connected.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install full 16-frame swallow-to-smile bridge sheet"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
