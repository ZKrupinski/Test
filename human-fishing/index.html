  else idx=Math.floor(rnd(0,11));
  var sp=species[zone*20+idx];
  fish.push({sp:sp,x:rnd(335,1180),y:rnd(340,612),vx:rnd(.25,.65)*(Math.random()<.5?-1:1),phase:rnd(0,6.28),size:idx>=18?1.58:idx>=15?1.21:rnd(.8,1.13)});
 }
}
function buildHum(){
 hum=[];var p=gearPower('bait'),bossChance=.00002+p*.000004,eliteChance=.006+p*.0005;
 var roll=Math.random();
 if(roll<bossChance||roll<bossChance+eliteChance){
  var boss=roll<bossChance,id=boss?20+Math.floor(rnd(0,4)):Math.floor(rnd(0,20));
  hum.push({id:id,x:rnd(415,1120),y:rnd(360,555),phase:rnd(0,6.28),vx:rnd(.16,.34)*(Math.random()<.5?-1:1),size:boss?1.31:1.02});
 }
}
var escapeFx=null,feverFx=null,feverSprites={};
function escapeHook(){
 if(!hook)return;
 var o=hook.obj,human=hook.kind==='human';
 var label=human?'인간 엘리트':o.sp.name;
 escapeFx={x:o.x,y:o.y,name:label,elapsed:0};
 spawnParticles(o.x,o.y,19,'water');ripple(o.x,o.y);
 beep('hit');hook=null;buildFish();buildHum();startCast();
 $('hintTitle').textContent=label+' · 줄을 뿌리치고 탈출!';
 $('hint').textContent='등급·레벨이 높을수록 저항합니다. 상점에서 좋은 장비를 장착하세요.';
}
function drawEscapeFx(dt){
 if(!escapeFx)return;var fx=escapeFx;fx.elapsed+=dt;var p=clamp(fx.elapsed/1.0,0,1);
 ctx.save();ctx.globalAlpha=1-p;ctx.textAlign='center';
 ctx.fillStyle='#ffc4b5';ctx.shadowColor='#041826';ctx.shadowBlur=7;
 ctx.font='900 20px system-ui';ctx.fillText('MISS · 탈출!',fx.x,fx.y-52-42*p);
 ctx.font='bold 13px system-ui';ctx.fillText(fx.name+' 저항 성공',fx.x,fx.y-28-42*p);
 ctx.restore();if(p>=1)escapeFx=null;
}
var oldReleaseForDifficulty=release;
release=function(){
 if(view!=='fish'||hook||cast.active||feverFx)return;
 if(save.fever.ready){activateOctoFever();return}
 oldReleaseForDifficulty();
 if(hook){
  var h=hook.kind==='human',target=h?{id:hook.obj.id}:hook.obj.sp;
  var chance=catchProbability(target,h,false);
  hook.captureChance=chance;
  hook.willEscape=Math.random()>chance;
  hook.escapeAt=.67+rnd(0,.21);
  if(hook.willEscape){
   $('hintTitle').textContent='격렬한 저항! 줄이 끊어질 듯 흔들려요';
   $('hint').textContent=(h?'ELITE / BOSS':tierLabels[target.rarity]+' Lv.'+target.level)+' · 포획률 '+(chance*100).toFixed(1)+'%';
  }
 }
};
function octoSprite(tier,frame,folding){
 var key=(folding?'fold-':'open-')+tier+'-'+frame;
 if(feverSprites[key])return feverSprites[key];
 var cvs=document.createElement('canvas');cvs.width=520;cvs.height=520;
 var g=cvs.getContext('2d'),x=260,y=260,col=gearCatalog.octopus[tier][4];
 var e=frame/11,arm=22+192*e,fold=folding?(1-e)*e:0;
 g.lineCap='round';g.lineJoin='round';
 for(var i=0;i<8;i++){
  var a=i*Math.PI/4-Math.PI/2,p1x=x+Math.cos(a)*arm*.54,p1y=y+Math.sin(a)*arm*.54;
  // Fold the tips into soft curls as the octopus lure is reeled upward.
  var curl=fold*60*(i%2===0?1:-1);
  var x2=x+Math.cos(a)*arm-Math.sin(a)*curl,y2=y+Math.sin(a)*arm+Math.cos(a)*curl;
  var wave=Math.sin(i*2.2+e*4)*25*e+fold*32;
  g.beginPath();g.moveTo(x,y);
  g.bezierCurveTo(x+Math.cos(a)*arm*.30-Math.sin(a)*wave,y+Math.sin(a)*arm*.30+Math.cos(a)*wave,p1x+Math.sin(a)*(wave+curl*.65),p1y-Math.cos(a)*(wave+curl*.65),x2,y2);
  g.strokeStyle='#34243fa6';g.lineWidth=22+(tier*.7);g.stroke();
  g.strokeStyle=col;g.lineWidth=16+tier*.8;g.stroke();
  for(var n=1;n<=3;n++){
   var p=n/4,px=mix(x,x2,p)+Math.sin(a)*Math.sin(Math.PI*p)*wave*.32,py=mix(y,y2,p)-Math.cos(a)*Math.sin(Math.PI*p)*wave*.32;
   g.beginPath();g.ellipse(px,py,3.5+tier*.35,4.5,0,0,Math.PI*2);g.fillStyle='#fff0daae';g.fill();
  }
 }
 var head=g.createRadialGradient(x-15,y-18,4,x,y,42+tier*2);head.addColorStop(0,'#fff0d9');head.addColorStop(.4,col);head.addColorStop(1,'#593f5b');
 g.fillStyle=head;g.beginPath();g.ellipse(x,y-12,33+tier*2,39+tier*2,0,0,Math.PI*2);g.fill();
 g.fillStyle='#fff3df';
 for(var k of [-1,1]){g.beginPath();g.ellipse(x+k*15,y-12,9,11,0,0,Math.PI*2);g.fill();g.fillStyle='#26303b';g.beginPath();g.arc(x+k*15+2,y-12,4,0,Math.PI*2);g.fill();g.fillStyle='#fff3df'}
 g.fillStyle='#6a3244';g.beginPath();g.ellipse(x,y+7,8,5,0,0,Math.PI*2);g.fill();
 if(tier===2||tier===4){g.fillStyle='#fff9de96';for(var j=0;j<8;j++){var a2=j*2.4;g.beginPath();g.arc(x+Math.cos(a2)*25,y+Math.sin(a2)*22-12,3,0,Math.PI*2);g.fill()}}
 if(tier===5){g.fillStyle='#ffeeb0';g.beginPath();g.moveTo(x-24,y-45);g.lineTo(x-21,y-69);g.lineTo(x-8,y-54);g.lineTo(x,y-73);g.lineTo(x+12,y-53);g.lineTo(x+24,y-68);g.lineTo(x+27,y-45);g.fill()}
 feverSprites[key]=cvs;return cvs;
}
var priorBobForFever=drawBob;
drawBob=function(){
 if(feverFx)return;
 if(!save.fever.ready){priorBobForFever();return}
 var g=selectedGear('octopus'),v=octoStats(g.tier,gearLevel('octopus',g.id)),size=v.size;
 ctx.save();
 ctx.shadowColor=g.color;ctx.shadowBlur=15;
 ctx.drawImage(octoSprite(g.tier,0),bob.x-size/2,bob.y-size/2,size,size);
 ctx.restore();
};
// Alpha 0.8: eight-tentacle harvest followed by a full queue of creatures into the main octopus mouth.
function activateOctoFever(){
 if(!save.fever.ready||feverFx||catchFx||view!=='fish')return;
 hideVirtualJoystick();
 var g=selectedGear('octopus'),v=octoStats(g.tier,gearLevel('octopus',g.id));
 var targets=[],resisted=0,coins=0,net=gearPower('net');
 var center={x:bob.x,y:bob.y};
 fish.filter(function(f){return !f.feverCaptured&&Math.hypot(f.x-center.x,f.y-center.y)<=v.radius}).forEach(function(f){
  var chance=catchProbability(f.sp,false,true);
  if(Math.random()<chance){
   var n=1+(net>0&&Math.random()<Math.min(.7,net*.035)?1:0);
   save.owned[f.sp.id]=(save.owned[f.sp.id]||0)+n;
   var reward=Math.floor((14+f.sp.index*5+save.up[2]*4)*(1+net*.025));
   save.coins+=reward;save.catches+=n;coins+=reward;
   if(save.placed.length===0)save.placed.push(f.sp.id);
   f.feverCaptured=true;
   // The individual species sprite remains whole until it reaches the octopus mouth.
   targets.push({x:f.x,y:f.y,sp:f.sp,size:f.size,vx:f.vx,phase:f.phase,quantity:n,human:false});
  }else resisted++;
 });
 // Human elites are exceptionally rare, and harder to hook than rare fish.
 // Boss humans remain immune to AOE harvesting, preserving their individual-boss status.
 hum.filter(function(h){return h.id<20&&!h.feverCaptured&&Math.hypot(h.x-center.x,h.y+22-center.y)<=v.radius}).forEach(function(h){
  var chance=catchProbability({id:h.id},true,true)*.85;
  if(Math.random()<chance){
   var id=String(h.id),reward=70+h.id*5;
   save.human[id]=(save.human[id]||0)+1;save.coins+=reward;save.catches++;coins+=reward;
   if(save.humanPlaced.length===0)save.humanPlaced.push(id);
   h.feverCaptured=true;
   targets.push({x:h.x,y:h.y,id:h.id,human:true,size:h.size||1,vx:h.vx,phase:h.phase,quantity:1});
  }else resisted++;
 });
 save.fever.ready=false;save.fever.count=0;save.fever.activations++;
 persist();updateStats();updateFeverHud();beep('catch');
 spawnParticles(center.x,center.y,52,'gold');ripple(center.x,center.y);
 var swallowSpacing=.155;
 feverFx={
  x:center.x,y:center.y,radius:v.radius,tier:g.tier,color:g.color,
  caught:targets,resisted:resisted,coins:coins,elapsed:0,
  duration:2.30+Math.max(0,targets.length-1)*swallowSpacing,
  swallowSpacing:swallowSpacing,reelProgress:0,reelFrame:0,reeling:false
 };
 $('hintTitle').textContent='🐙 피버! '+targets.length+'마리 입속으로 꿀꺽';
 $('hint').textContent='모든 포획 생물이 문어 입 안으로 들어간 뒤 다음 낚시로 이어집니다.';
}
// Rod retrieval and folding are one continuous movement. This also supplies
// the bait position used by drawLine(), keeping the fishing line attached.
function feverReelState(fx,now){
 var liftStart=.58,liftEnd=Math.max(liftStart+.6,fx.duration-.18);
 var raw=clamp((fx.elapsed-liftStart)/(liftEnd-liftStart),0,1);
 var smooth=raw*raw*(3-2*raw);
 var tip=rodTip(now),folding=fx.elapsed>=liftStart;
 var expanded=clamp(fx.elapsed/liftStart,0,1);
 var arm=folding?(1-smooth):expanded;
 return{
  progress:raw,folding:folding,frame:Math.max(0,Math.min(11,Math.round(arm*11))),
  x:mix(fx.x,tip.x-11,smooth),
  y:mix(fx.y,tip.y+18,smooth)-Math.sin(Math.PI*smooth)*18
 };
}
function drawFeverFx(dt){
 if(!feverFx)return;
 var fx=feverFx;fx.elapsed+=dt;
 var p=clamp(fx.elapsed/fx.duration,0,1);
 var reel=feverReelState(fx,time);
 fx.reelProgress=reel.progress;
 fx.reelFrame=reel.frame;
 fx.reeling=reel.folding;
 bob.x=reel.x;bob.y=reel.y;
 var diam=fx.radius*2+92;
 ctx.save();
 // The lure remains visible on its line as eight arms close, instead of fading out.
 ctx.shadowColor=fx.color;
 ctx.shadowBlur=reel.folding?12+10*(1-reel.progress):17+13*Math.sin(Math.PI*clamp(fx.elapsed/.58,0,1));
 ctx.drawImage(octoSprite(fx.tier,reel.frame,reel.folding),reel.x-diam/2,reel.y-diam/2,diam,diam);
 ctx.shadowBlur=0;
 ctx.globalAlpha=Math.max(0,1-p*.85);
 ctx.textAlign='center';ctx.shadowColor='#021820';ctx.shadowBlur=7;
 ctx.font='900 26px system-ui';ctx.fillStyle='#ffe8a1';
 var label=fx.caught.some(function(z){return z.human})?' · HUMAN':'';
 ctx.fillText('OCTO FEVER'+label,fx.x,Math.max(230,fx.y-115)-35*Math.min(1,p*2));
 ctx.font='900 17px system-ui';ctx.fillStyle='#f6ffea';
 ctx.fillText(fx.caught.length+' CATCH · '+fx.resisted+' RESIST · ◈ '+fx.coins,fx.x,Math.max(255,fx.y-84)-35*Math.min(1,p*2));
 ctx.restore();
 var mouth=mouthPos(time);
 fx.caught.forEach(function(entity,i){
  drawSwallowCreature(entity,fx.elapsed,.73+i*fx.swallowSpacing,1.09,mouth);
 });
 if(fx.elapsed>=fx.duration){
  feverFx=null;buildFish();buildHum();
  if(view==='fish')startCast();
 }
}

var previousModeForFever=setMode;
setMode=function(m){previousModeForFever(m);updateFeverHud()};
updateFeverHud();

buildFish();buildHum();updateStats();setMode('fish');requestAnimationFrame(tick);
})();
</script></body></html>
