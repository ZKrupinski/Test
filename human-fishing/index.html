function drawingTank(now){
 sea(true);
 ctx.fillStyle='#fffdfa0c';ctx.fillRect(20,25,1240,656);
 ctx.strokeStyle='#c3e3e78b';ctx.lineWidth=20;ctx.strokeRect(20,25,1240,656);
 ctx.strokeStyle='#194451';ctx.lineWidth=6;ctx.strokeRect(20,25,1240,656);
 ctx.fillStyle='#cfb98b';ctx.fillRect(32,656,1216,30);
 for(var i=0;i<20;i++){var x=80+i*58+Math.sin(i*12)*16;ctx.fillStyle=colors[(i+decor*3)%colors.length]+'77';ctx.beginPath();ctx.ellipse(x,638,35,17,0,0,Math.PI*2);ctx.fill()}
 coral(now);
 save.placed.forEach(function(id,i){
  var sp=species.find(function(v){return v.id===id});if(!sp)return;
  var xx=100+(i*151)%1070+Math.sin(now*(.34+(i%4)*.08)+i)*50,yy=220+((i*89)%370)+Math.sin(now*.8+i)*18;
  drawFish({sp:sp,x:clamp(xx,90,1130),y:yy,vx:i%2===0?1:-1,size:1.05+(i%4)*.2,phase:i},now);
 });
 save.humanPlaced.forEach(function(id,i){
  var humanId=Number(id),sx=235+(i%4)*239+Math.sin(now*.6+i)*14,sy=318+Math.floor(i/4)*208+Math.sin(now*1.3+i)*10;
  circle(sx,sy+24,86,humanId>=20?'#ffd48721':'#93ecff24');
  ctx.beginPath();ctx.ellipse(sx,sy+24,84,108,0,0,Math.PI*2);ctx.lineWidth=4;ctx.strokeStyle=humanId>=20?'#ffe3a4a8':'#b0eaffaa';ctx.stroke();
  ctx.save();ctx.translate(sx,sy+6);ctx.scale(.76,.76);humanIcon({id:humanId,x:0,y:0,phase:i,size:1},now);ctx.restore();
  ctx.fillStyle='#f9e7c3';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText(humans[humanId],sx,sy+128);
 });
}
function tick(stamp){
 var dt=Math.min((stamp-last)/1000,.045);last=stamp;time+=dt;
 ctx.clearRect(0,0,W,H);
 if(view==='tank'){drawingTank(time)}
 else{
  sea(false);coral(time);
  if(view==='fish'||view==='book'||view==='grow'){
   fish.forEach(function(a){
    if(!hook||a!==hook.obj){a.x+=a.vx*dt*60;a.phase+=dt*.4;if(a.x<320||a.x>1195)a.vx*=-1}
    drawFish(a,time);
   });
   hum.forEach(function(a){
    if(!hook||a!==hook.obj){a.x+=a.vx*dt*55;a.phase+=dt*.23;if(a.x<350||a.x>1200)a.vx*=-1}
    humanIcon(a,time);
   });
  }
  drawOcto(time);
  if(view==='fish'){
   if(hook){
    hook.elapsed+=dt;
    var duration=hook.kind==='human'?(hook.obj.id>=20?2.5:1.85):(1.10-save.up[0]*.08);
    var p=ease(hook.elapsed/duration),o=hook.obj;
    o.x=mix(hook.startX,390,p)+ (hook.kind==='human'?Math.sin(time*21)*(1-p)*15:0);
    o.y=mix(hook.startY,260-55*Math.sin(p*Math.PI),p);
    bob.x=o.x;bob.y=o.y;
    if(hook.elapsed>=duration)success();
   }
   drawLine();if(!hook)drawBob();
  }
 }
 bubbles.forEach(function(b){
  b.y-=b.speed*dt*50;b.x+=Math.sin(time+b.phase)*dt*4;
  if(b.y<0){b.y=730;b.x=rnd(10,1250)}
  ctx.strokeStyle='#b4f8f052';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
 });
 particleFrame(dt);
 if(bannerTimer>0){bannerTimer-=dt;if(bannerTimer<=0)$('banner').classList.remove('visible')}
 requestAnimationFrame(tick);
}
$('navFish').onclick=function(){setMode('fish');chooseZone()};
$('navTank').onclick=function(){setMode('tank')};
$('navBook').onclick=function(){setMode('book')};
$('navGrow').onclick=function(){setMode('grow')};
$('action').onclick=function(){if(view==='fish'&&!hook)release()};

buildFish();buildHum();updateStats();setMode('fish');requestAnimationFrame(tick);
})();
</script></body></html>
